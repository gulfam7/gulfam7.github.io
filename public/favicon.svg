<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#30363d" stroke-width="3"/>
  <!-- k-space sampling lattice: the recurring motif of the site -->
  <g stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
    <line x1="14" y1="20" x2="50" y2="20"/>
    <line x1="14" y1="32" x2="50" y2="32"/>
    <line x1="14" y1="44" x2="50" y2="44"/>
  </g>
  <!-- centre of k-space -->
  <circle cx="32" cy="32" r="6.5" fill="#58a6ff"/>
  <circle cx="32" cy="32" r="11.5" fill="none" stroke="#7ee787" stroke-width="2.5" opacity="0.8"/>
</svg>
